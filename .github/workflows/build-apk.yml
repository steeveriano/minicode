name: Build APK

# Minimal APK pipeline for the storage-organizer work branch.
#
# The upstream CI (ci.yml) only runs on main and additionally spins up emulator
# E2E jobs, which this branch does not need. This workflow builds just the FOSS
# debug APK — debug-signed, so it installs by sideloading — and publishes it as
# a downloadable artifact.

on:
  workflow_dispatch:
  push:
    branches: [claude/mobile-storage-organizer-app-ehue55]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FOSS debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          # Full history: build.gradle.kts derives versionCode from the commit
          # count and refuses to configure without a git repository.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache cloudflared Android native
        id: cache-cloudflared
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libcloudflared.so
            app/src/main/jniLibs/x86_64/libcloudflared.so
          key: cloudflared-android-${{ runner.os }}-${{ hashFiles('.gitmodules', 'vendor/cloudflared/**/*.go', 'vendor/cloudflared/go.sum') }}

      - name: Cache ngrok-java Android native
        id: cache-ngrok-android
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libngrok_java.so
            app/src/main/jniLibs/x86_64/libngrok_java.so
            vendor/ngrok-java/ngrok-java/target/ngrok-java-1.2.0-SNAPSHOT.jar
            vendor/ngrok-java/ngrok-java-native/target/ngrok-java-native-classes.jar
          key: ngrok-android-v2-${{ runner.os }}-${{ hashFiles('.gitmodules', 'vendor/ngrok-java/**/*.toml', 'vendor/ngrok-java/**/pom.xml', 'vendor/ngrok-java/ngrok-java-native/src/**') }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.6'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile cloudflared for Android
        if: steps.cache-cloudflared.outputs.cache-hit != 'true'
        run: make compile-cloudflared

      - name: Compile ngrok-java native for Android
        if: steps.cache-ngrok-android.outputs.cache-hit != 'true'
        run: make compile-ngrok-native
        env:
          JAVA_11_HOME: ${{ env.JAVA_HOME }}
          JAVA_17_HOME: ${{ env.JAVA_HOME }}

      - name: Set up Python (geolocation DB generator)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compute DB-IP month
        id: dbip-month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache DB-IP source CSV
        uses: actions/cache@v6
        with:
          path: .dbip-cache
          key: dbip-csv-${{ steps.dbip-month.outputs.month }}

      - name: Cache ngrok-java host native build
        id: cache-ngrok-host
        uses: actions/cache@v6
        with:
          path: |
            vendor/ngrok-java/ngrok-java-native/target/ngrok-java-native-host.jar
            vendor/ngrok-java/ngrok-java-native/target/release/libngrok_java.so
          key: ngrok-host-${{ runner.os }}-${{ hashFiles('.gitmodules', 'vendor/ngrok-java/**/*.toml', 'vendor/ngrok-java/**/pom.xml', 'vendor/ngrok-java/ngrok-java-native/src/**') }}

      # The unit tests run on the JVM and load the host build of the ngrok native library, which
      # app/build.gradle.kts declares as testRuntimeOnly. The Android cross-compile above does not
      # produce it, so without this the test task cannot even resolve its classpath.
      - name: Build ngrok-java host native library (for JVM tests)
        if: steps.cache-ngrok-host.outputs.cache-hit != 'true'
        run: |
          cd vendor/ngrok-java
          mvn compile -pl ngrok-java-native --also-make --global-toolchains toolchains.xml -q
          (cd ngrok-java-native && cargo build --release)
          (cd ngrok-java-native/target/release && jar cf ../ngrok-java-native-host.jar $(ls libngrok_java.so libngrok_java.dylib 2>/dev/null))
        env:
          JAVA_11_HOME: ${{ env.JAVA_HOME }}
          JAVA_17_HOME: ${{ env.JAVA_HOME }}

      # Runs before the APK so a behavioural regression fails the job in the cheap step rather
      # than after a full assemble.
      - name: Run unit and integration tests
        run: ./gradlew :app:testFossDebugUnitTest -PexcludeNetworkTests

      - name: Build FOSS debug APK
        run: ./gradlew assembleFossDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-foss-debug
          path: app/build/outputs/apk/foss/debug/app-foss-debug.apk
          retention-days: 30
