# Netlify config for the web viewer in `web/`.
#
# It sits at the repository root because `base` is resolved from there: inside `web/` it would
# resolve to `web/web`. The Android app is the rest of this repository and has nothing to do with
# this deploy.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# A single-page app: every path has to reach index.html, or a refresh on a deep link 404s.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # The page is a private inventory of one person's phone. Keep it out of search engines and out
    # of referrer headers, and let nothing embed it.
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    # `connect-src` names exactly one origin: the Supabase project. That is what keeps proving the
    # page cannot reach the phone — the device's tunnel is not in this list, so a request to it is
    # blocked by the browser whatever ends up in the bundle later.
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://fqrrcoupmwssqbatgxrs.supabase.co wss://fqrrcoupmwssqbatgxrs.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
